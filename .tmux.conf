# --- Core behavior ---

# Low escape time for responsive SSH (default 500ms is painful over SSH)
set -g escape-time 10

# Never infer vi-style key tables from EDITOR/VISUAL.
set -g mode-keys emacs
set -g status-keys emacs

# Large scroll buffer
set -g history-limit 10000

# Enable mouse (essential for Termius touch interaction)
set -g mouse on

# Color support
set -g allow-passthrough on
set -g default-terminal "tmux-256color"
set-environment -g COLORTERM "truecolor"
set-environment -gu TERMINFO

# Claude Code deliberately downgrades its colors to 256 whenever $TMUX is set
# (a conservative default for tmux setups that mishandle truecolor). This env
# var is its built-in escape hatch: it disables that downgrade so Claude renders
# the same 24-bit truecolor gradients inside tmux as in a plain Ghostty window.
# Needs COLORTERM=truecolor above, which sets the base level to truecolor.
set-environment -g CLAUDE_CODE_TMUX_TRUECOLOR 1
set -g terminal-features "xterm*:clipboard:ccolour:cstyle:focus:title,screen*:title,rxvt*:ignorefkeys"
set -as terminal-features ",xterm*:extkeys"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-256color:RGB"

# Start window/pane numbering at 1 (easier on mobile keyboards)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# --- Status bar (clean, mobile-friendly) ---

set -g status-position bottom
set -g status-interval 30
set -g status-style "bg=colour235,fg=colour248"

# Left: session name
set -g status-left " #S "
set -g status-left-length 20
set -g status-left-style "bg=colour240,fg=colour255,bold"

# Right: time + date (compact)
set -g status-right " %H:%M %b-%d "
set -g status-right-length 20
set -g status-right-style "bg=colour240,fg=colour255"

# Window labels
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
setw -g window-status-current-style "bg=colour25,fg=colour255,bold"

# --- Key bindings ---

# Prefix: Ctrl-s (easier than Ctrl-b on mobile keyboards)
set -g prefix C-s
unbind C-b
bind C-s send-prefix

# Split panes with | and - (intuitive)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Navigate panes with Alt+arrow (no prefix needed)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# New window in current directory
bind c new-window -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Plugins
set -g @resurrect-save 'S'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'
